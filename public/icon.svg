<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#463207"/>
      <stop offset="60%" stop-color="#2A1E05"/>
      <stop offset="100%" stop-color="#1C1403"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC94D"/>
      <stop offset="100%" stop-color="#F09400"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="squircle">
      <rect x="44" y="44" width="424" height="424" rx="96"/>
    </clipPath>
  </defs>
  <!-- macOS 스타일: 투명 여백 + 둥근 사각형 (Chrome이 흰 컨테이너를 덧대지 않음) -->
  <g clip-path="url(#squircle)">
    <rect x="44" y="44" width="424" height="424" fill="url(#bg)"/>
  </g>
  <g transform="translate(256 256) scale(0.83) translate(-256 -256)">
    <circle cx="256" cy="256" r="132" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="40"/>
    <path d="M 256 124 A 132 132 0 1 1 124 256" fill="none" stroke="#F5A524" stroke-width="40" stroke-linecap="round" filter="url(#glow)" opacity="0.5"/>
    <path d="M 256 124 A 132 132 0 1 1 124 256" fill="none" stroke="url(#arc)" stroke-width="40" stroke-linecap="round"/>
  </g>
</svg>
